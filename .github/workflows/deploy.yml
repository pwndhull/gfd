name: Build and deploy

# Lints and builds the book, then publishes the result to docs/ so GitHub
# Pages (configured to deploy from main / docs) picks it up automatically.
#
# Only source changes trigger this — a run that touches only docs/ (i.e.
# the commit this workflow itself makes) doesn't match these paths, so it
# won't trigger another run.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "src/**"
      - "public/**"
      - "build.mjs"
      - "lint.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint content
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish build output to docs/
        run: |
          rm -f docs/index.html
          cp dist/index.html docs/
          if [ -d public ]; then
            cp -r public/. docs/
          fi

      - name: Commit and push if docs/ changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Auto-build: publish docs/ from latest source"
            git push
          fi
